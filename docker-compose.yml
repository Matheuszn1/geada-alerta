services:
  db:
    image: postgres:16-alpine
    container_name: geada-alerta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geada}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geada_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-geada_alerta}
      TZ: America/Sao_Paulo
    ports:
      # 5433 no host para não conflitar com um PostgreSQL já instalado na máquina
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - geada_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geada} -d ${POSTGRES_DB:-geada_alerta}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geada_pgdata:
